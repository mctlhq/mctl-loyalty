name: Claude PR review

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  issue_comment:
    types: [created]

permissions: {}

jobs:
  claude-review:
    uses: mctlhq/.github/.github/workflows/claude-review.yml@aca5e626d3066bde2b408697b8667ed6bf4eb51d
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    with:
      # dependabot is listed so its PRs get reviewed automatically.
      # Without it claude-code-action hard-fails with "Workflow initiated
      # by non-human actor", and since branch protection requires an
      # approving review, dependabot PRs then sit unmergeable until a
      # maintainer triggers a review by hand.
      allowed-bots: "mctl-claude-remote,github-actions,dependabot"
      sensitive-paths: '^src/(services|routes|db|middleware|telegram|qr)/'
      conventions: |
        - Money/ledger integrity: every balance or stock mutation must be a
          single DB transaction with the right row locks; no double-spend,
          no lost holds, no negative balance.
        - Concurrency: races between scans/redeems/sweeper, deadlocks,
          lock-ordering, missing FOR UPDATE.
        - Telegram initData validation on any auth-adjacent endpoint.
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
